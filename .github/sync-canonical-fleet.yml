# Configuration for sync-canonical-to-fleet.yml — drives BetaHuhn/repo-file-sync-action.
#
# Each top-level key is the target GitHub repo; the `files` list under it is the
# set of files synced from this template (LHS) to the target (RHS). The action
# opens a PR per target with whatever has changed.
#
# Authoritative spec: hydra/openspec/architecture/adr-033-root-config-consolidation.md
#
# Scope-control notes
# -------------------
# - phpstan-baseline.neon and psalm-baseline.xml are INTENTIONALLY NOT synced.
#   Each app populates its own baseline with tracked-debt entries per ADR-033.
#   The canonical ships them empty as scaffolding (initial sync only).
# - phpcs.xml and phpmd.xml are byte-for-byte synced. After merge each app
#   re-applies its cosmetic <description> / <ruleset name> string — the only
#   allowed deviation. This is a known manual step.
# - Apps not listed here (ExApp sidecar wrappers, external repos like
#   Softwarecatalogus / nextcloud-vue) are deliberately out of scope.

group:
  files:
    - source: phpcs.xml
      dest: phpcs.xml
    - source: phpmd.xml
      dest: phpmd.xml
    - source: psalm.xml
      dest: psalm.xml
    - source: phpstan.neon
      dest: phpstan.neon
    - source: phpstan-bootstrap.php
      dest: phpstan-bootstrap.php
    - source: phpcs-custom-sniffs/CustomSniffs/Sniffs/
      dest: phpcs-custom-sniffs/CustomSniffs/Sniffs/
  repos: |
    ConductionNL/openregister@development
    ConductionNL/opencatalogi@development
    ConductionNL/openconnector@development
    ConductionNL/docudesk@development
    ConductionNL/nldesign@development
    ConductionNL/mydash@development
    ConductionNL/softwarecatalog@development
    ConductionNL/larpingapp@development
    ConductionNL/zaakafhandelapp@development
    ConductionNL/procest@development
    ConductionNL/pipelinq@development
    ConductionNL/decidesk@development
    ConductionNL/scholiq@development
    ConductionNL/shillinq@development
    ConductionNL/planix@development
    ConductionNL/deskdesk@development
    ConductionNL/openbuilt@development
